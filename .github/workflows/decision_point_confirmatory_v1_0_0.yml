name: Held-out confirmatory role-framing experiment v1.0.0
on:
  push:
    branches: [codex/execute-micro-pilot-on-current-branch-vsnbkd]
permissions:
  contents: read
jobs:
  confirmatory:
    if: github.event.head_commit.message == 'Run held-out confirmatory role-framing experiment [experiment-v1.0.0]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: mkdir artifact && printf '{"status":"initialized"}\n' > artifact/workflow_status.json
      - run: python -m pip install tiktoken==0.13.0 openai-harmony==0.0.8
      - run: python -m pip install pytest==8.4.2
      - name: Complete pytest suite
        shell: bash
        run: set -o pipefail; PYTHONDONTWRITEBYTECODE=1 python -m pytest -q 2>&1 | tee artifact/pytest.log
      - name: Execute confirmatory experiment once
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m btom_v2.run_decision_point_confirmatory_v1_0_0 --output-dir artifact/confirmatory
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-point-confirmatory-v1.0.0-${{ github.run_id }}
          path: artifact
          retention-days: 30
