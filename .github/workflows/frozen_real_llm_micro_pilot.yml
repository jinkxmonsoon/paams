name: Frozen real-LLM micro-pilot

on:
  push:
    branches:
      - codex/execute-micro-pilot-on-current-branch-vsnbkd

permissions:
  contents: read

jobs:
  frozen-pilot:
    if: github.event.head_commit.message == 'Add GitHub Actions frozen pilot executor [run-frozen-pilot-v1]'
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PROTOCOL_VERSION: btom-v2-functional-micro-pilot-1.0
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Prepare failure diagnostics artifact
        run: |
          mkdir -p "btom_v2/outputs/workflow-diagnostics-${GITHUB_RUN_ID}"
          printf '{"git_sha":"%s","status":"tests_pending"}\n' "$GITHUB_SHA" > \
            "btom_v2/outputs/workflow-diagnostics-${GITHUB_RUN_ID}/workflow_status.json"

      - name: Run complete test suite
        run: pytest -q

      - name: Execute frozen pilot once
        run: python -m btom_v2.run_frozen_micro_pilot

      - name: Upload frozen pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-real-llm-pilot-${{ env.PROTOCOL_VERSION }}-${{ github.run_id }}
          path: btom_v2/outputs/
          if-no-files-found: error
          retention-days: 30
