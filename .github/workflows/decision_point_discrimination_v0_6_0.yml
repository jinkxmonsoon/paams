name: Scenario discrimination experiment v0.6.0
on:
  push:
    branches: [codex/execute-micro-pilot-on-current-branch-vsnbkd]
permissions:
  contents: read
jobs:
  experiment:
    if: github.event.head_commit.message == 'Correct scenario discrimination inputs [experiment-v0.6.0]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: mkdir artifact && printf '{"status":"initialized"}\n' > artifact/workflow_status.json
      - run: python -m pip install tiktoken==0.13.0 openai-harmony==0.0.8
      - run: python -m pip install pytest==8.4.2
      - name: Complete pytest suite
        shell: bash
        run: set -o pipefail; PYTHONDONTWRITEBYTECODE=1 python -m pytest -q 2>&1 | tee artifact/pytest.log
      - name: Execute experiment once
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m btom_v2.run_decision_point_discrimination_v0_6_0 --output-dir artifact/experiment
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-point-discrimination-v0.6.0-${{ github.run_id }}
          path: artifact
          retention-days: 30
