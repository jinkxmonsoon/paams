name: Mandatory 120B full dual-account confirmatory replication v1.0.0
on:
  push:
    branches: [codex/execute-micro-pilot-on-current-branch-vsnbkd]
permissions:
  contents: read
jobs:
  replication:
    if: github.event.head_commit.message == 'Execute mandatory 120B replication [experiment-v1.0.0]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: mkdir artifact && printf '{"status":"initialized"}\n' > artifact/workflow_status.json
      - run: python -m pip install tiktoken==0.13.0 openai-harmony==0.0.8 pytest==8.4.2
      - name: Complete pytest suite
        run: set -o pipefail; PYTHONDONTWRITEBYTECODE=1 python -m pytest -q 2>&1 | tee artifact/pytest.log
      - name: Execute mandatory 120B replication once
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_SECONDARY: ${{ secrets.GROQ_API_KEY_SECONDARY }}
        run: |
          set +e
          python -m btom_v2.run_decision_point_confirmatory_full_dual_account_120b_v1_0_0 --output-dir artifact/confirmatory_full_dual_120b
          runner_exit_code=$?
          printf '{"status":"completed","execution_sha":"%s","runner_exit_code":%d}\n' "$GITHUB_SHA" "$runner_exit_code" > artifact/workflow_status.json
          exit "$runner_exit_code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decision-point-confirmatory-full-dual-account-120b-v1.0.0-${{ github.run_id }}
          path: artifact
          retention-days: 30
