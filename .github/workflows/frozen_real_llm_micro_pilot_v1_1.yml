name: Frozen rate-aware real-LLM micro-pilot v1.1

on:
  push:
    branches:
      - codex/execute-micro-pilot-on-current-branch-vsnbkd

permissions:
  contents: read

jobs:
  rate-aware-pilot:
    if: github.event.head_commit.message == 'Run rate-aware functional pilot v1.1 [run-rate-aware-pilot-v1.1]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PROTOCOL_VERSION: btom-v2-functional-micro-pilot-1.1-rate-aware
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Prepare failure diagnostics artifact
        run: |
          mkdir -p "btom_v2/outputs/workflow-diagnostics-v1.1-${GITHUB_RUN_ID}"
          printf '{"git_sha":"%s","status":"tests_pending"}\n' "$GITHUB_SHA" > \
            "btom_v2/outputs/workflow-diagnostics-v1.1-${GITHUB_RUN_ID}/workflow_status.json"

      - name: Run complete test suite
        run: pytest -q

      - name: Execute rate-aware frozen pilot once
        run: python -m btom_v2.run_frozen_micro_pilot_v1_1

      - name: Upload rate-aware pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-real-llm-pilot-${{ env.PROTOCOL_VERSION }}-${{ github.run_id }}
          path: btom_v2/outputs/
          if-no-files-found: error
          retention-days: 30
